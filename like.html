<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no disponible - Atom-Craft</title>
  
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Minecraftia', Arial, sans-serif;
      /* Aquí conectamos tu nueva imagen de fondo */
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                  url('img/cierre-pag.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff; display: flex; flex-direction: column;
      min-height: 100vh; box-sizing: border-box;
    }
    nav { background: rgba(0, 0, 0, 0.5); padding: 15px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    nav a { color: #00ff00; text-decoration: none; font-weight: bold; margin: 0 10px; }
    nav a.disabled { color: #888; pointer-events: none; text-decoration: line-through; }
    .logo-container { display: flex; justify-content: center; align-items: center; margin-top: 30px; margin-bottom: 20px; }
    .logo { width: 50%; max-width: 500px; min-width: 300px; }
    .unavailable-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .minecraft-box { background: #2e2e2e; border: 6px solid #1a1a1a; box-shadow: inset -6px -6px 0px #121212, inset 6px 6px 0px #5c5c5c; max-width: 600px; width: 100%; padding: 30px 20px; border-radius: 4px; text-align: center; }
    .minecraft-box h1 { color: #ff2222; text-shadow: 3px 3px 0px #3f0000; font-size: 1.8rem; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; }
    .minecraft-box p { color: #e0e0e0; font-size: 1rem; line-height: 1.6; margin: 0 0 25px 0; text-shadow: 2px 2px 0px #000; }
    .mc-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: #4a4a4a; color: #fff; font-size: 0.95rem; padding: 12px 24px; border: 4px solid #000; box-shadow: inset -4px -4px 0px #2e2e2e, inset 4px 4px 0px #8b8b8b; cursor: pointer; text-transform: uppercase; transition: all 0.1s ease; font-family: 'Minecraftia', sans-serif; }
    .mc-btn:hover { background: #3a5c18; box-shadow: inset -4px -4px 0px #1e3a00, inset 4px 4px 0px #638e32; }
    .mc-btn:active { transform: scale(0.95); }
    .mc-btn-icon { font-size: 1.2rem; margin-right: 10px; }
    @media (max-width: 600px) { .logo { width: 85%; } .minecraft-box { padding: 25px 15px; } .minecraft-box h1 { font-size: 1.4rem; } .minecraft-box p { font-size: 0.85rem; } .mc-btn { font-size: 0.85rem; padding: 10px 18px; } }
  </style>
</head>
<body>

  <!-- Barra de navegación con "Likes" desactivado -->
  <nav>
    <a href="index.html">Atom</a> |
    <a href="vip.html">Vip</a> |
    <a href="servidor.html">Status</a> |
    <a href="#" class="disabled">Likes</a>
  </nav>

  <div class="logo-container">
    <img src="img/Logo-Principal.png" alt="Atom-Craft Logo" class="logo" />
  </div>

  <div class="unavailable-container">
    <div class="minecraft-box">
      <h1>🚫 PÁGINA NO DISPONIBLE 🚫</h1>
      <p>
        Esta sección del sitio ha sido cerrada temporalmente.<br>
        Disculpa las molestias, aventurero/a.
      </p>
      <a href="index.html" class="mc-btn">
        <span class="mc-btn-icon">↩</span> Volver al Inicio
      </a>
    </div>
  </div>

</body>
</html>
